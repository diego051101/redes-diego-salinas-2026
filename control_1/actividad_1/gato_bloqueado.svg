<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260" viewBox="0 0 300 260">
  <rect width="300" height="260" fill="#fef3e6"/>

  <!-- cuerpo -->
  <ellipse cx="150" cy="190" rx="90" ry="55" fill="#e8935a"/>

  <!-- cabeza -->
  <circle cx="150" cy="110" r="75" fill="#f2a86b"/>

  <!-- orejas -->
  <polygon points="90,60 60,10 120,50" fill="#f2a86b"/>
  <polygon points="210,60 240,10 180,50" fill="#f2a86b"/>
  <polygon points="90,55 75,25 108,48" fill="#e8935a"/>
  <polygon points="210,55 225,25 192,48" fill="#e8935a"/>

  <!-- ojos -->
  <ellipse cx="120" cy="105" rx="12" ry="16" fill="#2b2b2b"/>
  <ellipse cx="180" cy="105" rx="12" ry="16" fill="#2b2b2b"/>
  <circle cx="123" cy="99" r="3" fill="#ffffff"/>
  <circle cx="183" cy="99" r="3" fill="#ffffff"/>

  <!-- nariz -->
  <polygon points="150,125 142,135 158,135" fill="#c96a4a"/>

  <!-- boca -->
  <path d="M 150 135 Q 150 145 135 145" stroke="#2b2b2b" stroke-width="3" fill="none"/>
  <path d="M 150 135 Q 150 145 165 145" stroke="#2b2b2b" stroke-width="3" fill="none"/>

  <!-- bigotes -->
  <line x1="60" y1="115" x2="110" y2="118" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="60" y1="130" x2="110" y2="128" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="240" y1="115" x2="190" y2="118" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="240" y1="130" x2="190" y2="128" stroke="#2b2b2b" stroke-width="2"/>

  <!-- texto -->
  <text x="150" y="240" font-family="monospace" font-size="20" fill="#7a3b1e" text-anchor="middle">Acceso bloqueado :(</text>
</svg>
